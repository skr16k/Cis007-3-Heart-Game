% rebase('views/base.html', session=session)
<section class="glass">
  <h1 class="headline text-2xl font-bold mb-4">Play the Heart Game</h1>
  <p class="mb-6 text-slate-600">Choose a difficulty and level (1–10), fetch a puzzle, then submit your answer. You have <strong>30 seconds</strong> per puzzle.</p>
  <div class="grid md:grid-cols-5 gap-4 mb-4">
    <div>
      <label class="text-sm text-slate-600">Difficulty</label>
      <select id="difficulty" class="mt-1 w-full border rounded-lg p-2">
        <option>easy</option>
        <option>medium</option>
        <option>hard</option>
      </select>
    </div>
    <div>
      <label class="text-sm text-slate-600">Level</label>
      <select id="level" class="mt-1 w-full border rounded-lg p-2">
        % for i in range(1, 11):
        <option>{{i}}</option>
        % end
      </select>
    </div>
    <div class="flex items-end">
      % if session:
      <button id="fetch-btn" class="w-full btn btn-primary">Get Puzzle</button>
      % else:
      <a href="/login" class="w-full text-center btn btn-primary">Login to Play</a>
      % end
    </div>
    <div class="flex items-end">
      <button id="next-btn" class="w-full btn btn-secondary" disabled>Next Puzzle</button>
    </div>
    <div class="flex items-end justify-end">
      <button id="end-btn" class="w-full btn btn-danger">End Game</button>
    </div>
  </div>
  <div class="glass">
    <div class="flex items-center justify-between mb-3">
      <div id="question" class="font-medium">Click "Get Puzzle" to start…</div>
      <div class="text-slate-500">⏱ <span id="timer">30s</span></div>
    </div>
    <img id="puzzle-image" class="w-full max-h-72 object-contain rounded-lg mb-3" style="display:none;" alt="Puzzle Image"/>
    <input id="answer" type="text" placeholder="Your answer…" class="border rounded-lg p-2 w-full mb-3"/>
    <input id="correct" type="hidden"/>
    <button id="submit-btn" class="btn btn-primary">Submit</button>
    <div id="result" class="mt-3 text-lg"></div>
  </div>
</section>
