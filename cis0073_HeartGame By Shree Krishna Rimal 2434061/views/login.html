% rebase('views/base.html', session=None)
<section class="glass max-w-md mx-auto">
  <h1 class="headline text-2xl font-bold mb-4">Login</h1>
  % if error:
  <div class="bg-red-50 text-red-700 p-3 rounded mb-4">{{error}}</div>
  % end
  <form method="post" class="space-y-3">
    <input name="username" class="input" placeholder="Username"/>
    <input type="password" name="password" class="input" placeholder="Password"/>
    <button class="btn btn-primary w-full">Login</button>
  </form>
  <p class="text-xs text-slate-500 mt-3">Tip: default admin after first run — <code>admin / admin1234</code>.</p>
</section>
